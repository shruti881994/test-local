<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Recipe API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

<body>

        <button id="italian" type="button" class="theme-success btn-outline btn-styled">Italian</button>
        <button id="thai" type="button" class="theme-warning btn-outline btn-styled">Thai</button>

     </div>

     <!-- search field -->
      <div class="container py-5 text-center">
        <input type="email" class="form-control" id="search" placeholder="Type Food here">

<script src="script.js" ></script>
